spring.application.name=week3.restapi

spring.datasource.url=jdbc:mysql://localhost:3306/employee_dir
spring.datasource.username=root
# For safety, do not commit your real local database password to GitHub.
# Option 1: replace your_password_here with your MySQL password before running locally.
# Option 2: set an environment variable named DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:your_password_here}

# Optional but helpful
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

