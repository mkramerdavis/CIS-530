spring.application.name=cis530-week8

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cis530_week5
spring.datasource.username=# your_mysql_username
spring.datasource.password=#your_mysql_password

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic schema initialization
spring.sql.init.mode=never

# OAuth2 client registration for Google
spring.security.oauth2.client.registration.google.client-id=# your_google_client_id
spring.security.oauth2.client.registration.google.client-secret=# your_google_client_secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth2 client registration for GitHub
spring.security.oauth2.client.registration.github.client-id=# your_github_client_id
spring.security.oauth2.client.registration.github.client-secret=# your_github_client_secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email


# Swagger / OpenAPI documentation settings
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs