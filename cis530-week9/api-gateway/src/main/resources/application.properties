# Application configuration
spring.application.name=api-gateway
server.port=8080

# Eureka service registration
# Allows the API Gateway to register with the Eureka Server.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Student Service route
# Forward requests matching /api/students/** to Student Service.
# Eureka locates the service using its registered application name.
spring.cloud.gateway.server.webmvc.routes[0].id=student-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://student-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/students/**

# Student Profile Service route
# Forward requests matching /api/profiles/** to Student Profile Service.
# Eureka locates the service using its registered application name.
spring.cloud.gateway.server.webmvc.routes[1].id=student-profile-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://student-profile-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/profiles/**
